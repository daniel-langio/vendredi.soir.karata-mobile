name: Release Major Version

# Explicit, manual major-version bump - deliberately separate from build_apk.yml's automatic
# patch/minor bump, since a major version is a real product decision, not something that should
# ever fall out of a commit message convention alone.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  release-major:
    name: Build, distribute and tag a major version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis and formatting
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Bump major version
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '\r')
          IFS='.' read -r MAJOR _ _ <<< "$CURRENT_VERSION"
          VERSION_NAME="$((MAJOR + 1)).0.0"
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.version.outputs.build_number }}

      - name: Rename APK for easy sideloading
        id: rename
        run: |
          APK_NAME="Karata-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}.apk"
          mkdir -p build/app/outputs/flutter-apk/release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/release/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/210977503792/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-distributor@karata0.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to testers via Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}" \
            --app "1:210977503792:android:c89d272d5d925f5c4dcbf5" \
            --groups "testers" \
            --release-notes "Major version release: v${{ steps.version.outputs.version_name }}"

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): v${{ steps.version.outputs.version_name }} (major) [skip ci]"
          git tag "v${{ steps.version.outputs.version_name }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version_name }}"
          gh release create "v${{ steps.version.outputs.version_name }}" \
            "build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}" \
            --title "v${{ steps.version.outputs.version_name }}" \
            --generate-notes
