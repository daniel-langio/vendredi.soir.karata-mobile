name: Build Release APK

on:
  push:
    branches:
      - main
      - preprod
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# One release at a time per branch. Two pushes landing close together used to build concurrently,
# and since each run computes its version from its own checkout, both arrived at the same version
# name and distributed two different APKs under it - leaving App Tester with nothing unambiguous
# to offer. Queue rather than cancel, so no pushed commit silently goes undistributed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis and formatting
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Compute version
        id: version
        env:
          # A GitHub Actions expression interpolated straight into a shell string is unsafe for
          # arbitrary text like a commit message - backticks/$()/quotes in it would be re-parsed
          # by bash (this bit a real commit once: a `code span` in the message broke the build).
          # Routing it through an env var instead means bash treats the whole value as inert text.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # versionCode (the build number) auto-increments every commit via the commit count, so
          # every build is distinct and installable over the last one - Android refuses to install
          # an APK whose versionCode doesn't strictly increase.
          #
          # versionName (the human-readable "1.0.0") auto-increments too, on real pushes only: a
          # `feat` commit bumps minor (resets patch to 0), anything else bumps patch. Major is
          # deliberately never bumped here - see release_major.yml for that, a separate explicit
          # action rather than something that falls out of a commit message convention.
          # Both numbers come from the branch's *remote* tip on a push, not from this run's
          # checkout: checkout pins to the pushed commit, so a run queued behind another one reads
          # a pubspec that predates the release commit the run ahead of it just pushed, and would
          # compute a version name that was already used.
          if [ "${{ github.event_name }}" = "push" ]; then
            git fetch --quiet origin "${{ github.ref_name }}"
            BASE_REF="origin/${{ github.ref_name }}"
          else
            BASE_REF="HEAD"
          fi

          BUILD_NUMBER=$(git rev-list --count "$BASE_REF")
          CURRENT_VERSION=$(git show "$BASE_REF:pubspec.yaml" | grep '^version:' | sed 's/version: *//' | cut -d'+' -f1 | tr -d '\r')

          if [ "${{ github.event_name }}" = "push" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            if echo "$COMMIT_MESSAGE" | grep -qE '^feat(\(.+\))?!?:'; then
              VERSION_NAME="${MAJOR}.$((MINOR + 1)).0"
            else
              VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          else
            VERSION_NAME="$CURRENT_VERSION"
          fi

          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # Only real pushes decode the release keystore - PR builds (including from forks, which
      # never see repo secrets anyway) fall back to debug signing in build.gradle.kts, and a
      # PR build's signature never needs to match a distributed release's.
      - name: Decode release keystore
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/karata-release.jks
          cat > android/key.properties <<EOF
          storeFile=karata-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.version.outputs.build_number }}

      # The decoded keystore and its passwords must not outlive this job - nothing past this
      # point needs them, and self-hosted/reused runners must not carry them to the next job.
      - name: Remove release keystore
        if: always()
        run: rm -f android/app/karata-release.jks android/key.properties

      - name: Rename APK for easy sideloading
        id: rename
        run: |
          APK_NAME="Karata-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}.apk"
          mkdir -p build/app/outputs/flutter-apk/release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/release/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      # Short retention on purpose: a pushed build's APK is also attached to its GitHub release
      # and sent to Firebase, so this copy only really matters for PR builds, which cut no
      # release. Keeping them the default 90 days filled the account's Actions storage quota and
      # started failing uploads with a 403 at finalize.
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}
          retention-days: 7

      # Only real pushes (not PRs) get distributed to testers - a PR build isn't necessarily
      # meant for testers yet, and this keeps every distributed release traceable to a branch.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/210977503792/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-distributor@karata0.iam.gserviceaccount.com

      - name: Install Firebase CLI
        if: github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: Distribute to testers via Firebase App Distribution
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}" \
            --app "1:210977503792:android:c89d272d5d925f5c4dcbf5" \
            --groups "testers" \
            --release-notes "$COMMIT_MESSAGE"

      # Commits the version bump made in "Compute version" and tags/publishes it - only after a
      # successful build+distribution, so a broken commit never ends up tagged as a release.
      # `[skip ci]` on the commit message is required: without it, this push would re-trigger this
      # same workflow, bumping the version again in a loop.
      - name: Tag and publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Land the bump on the branch's current tip rather than on this run's checkout, which may
          # be an older commit by now - committing on the stale checkout is what made this push get
          # rejected as non-fast-forward, failing the release after the APK had already gone out.
          git fetch --quiet origin "${{ github.ref_name }}"
          git checkout -f -B release-bump "origin/${{ github.ref_name }}"
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}/" pubspec.yaml
          git add pubspec.yaml
          git commit -m "chore(release): v${{ steps.version.outputs.version_name }} [skip ci]"
          git tag "v${{ steps.version.outputs.version_name }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version_name }}"
          gh release create "v${{ steps.version.outputs.version_name }}" \
            "build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}" \
            --title "v${{ steps.version.outputs.version_name }}" \
            --generate-notes
