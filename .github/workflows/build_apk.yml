name: Build Release APK

on:
  push:
    branches:
      - main
      - preprod
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis and formatting
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Compute build number
        id: version
        run: |
          # versionName (the human-readable "1.0.0") is bumped manually in pubspec.yaml when it
          # actually changes; versionCode (the build number) auto-increments every commit via the
          # commit count instead, so every build is distinct and installable over the last one -
          # Android refuses to install an APK whose versionCode doesn't strictly increase.
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '\r')
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.version.outputs.build_number }}

      - name: Rename APK for easy sideloading
        id: rename
        run: |
          APK_NAME="Karata-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}.apk"
          mkdir -p build/app/outputs/flutter-apk/release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/release/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/release/${{ steps.rename.outputs.apk_name }}
